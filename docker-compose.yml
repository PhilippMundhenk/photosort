services:
  photosort:
    build:
      context: .
      target: runtime
    image: ${PHOTOSORT_IMAGE:-ghcr.io/philippmundhenk/photosort:latest}
    container_name: photosort
    restart: unless-stopped
    # run as the NAS user so moved files keep sane ownership on the SMB/NFS mount
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      PHOTOSORT_DATA: /data
      TZ: ${TZ:-UTC}                                  # home zone: naive photo times, video UTC conversion
    volumes:
      - ./data:/data                                  # config.yaml, proposals.json, events.jsonl
      # ONE mount holding both inbox/ and sorted/: a move is then a rename on the share. Mounting
      # the two folders separately (as earlier versions did) makes every move a copy through the
      # container and back over the network - 87 files took minutes. The paths inside the
      # container are configured in Settings (inbox root /photos/inbox, sorted root /photos/sorted).
      - ${PHOTOS_BASE:-/mnt/nas/photos}:/photos
    ports:
      - "8080:8080"
    # labels for Traefik, adapt to your setup:
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.photosort.rule=Host(`photosort.example.org`)
    #   - traefik.http.routers.photosort.middlewares=authelia@docker
    mem_limit: 1g          # the record cache of a large library plus the thumbnail helper; 512m was OOM-killed

