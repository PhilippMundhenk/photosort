services:
  photosort:
    build:
      context: .
      target: runtime
    image: ${PHOTOSORT_IMAGE:-ghcr.io/philippmundhenk/photosort:latest}
    container_name: photosort
    restart: unless-stopped
    # run as the NAS user so moved files keep sane ownership on the SMB/NFS mount
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      PHOTOSORT_DATA: /data
      TZ: ${TZ:-UTC}                                  # home zone: naive photo times, video UTC conversion
      # default decision-model URL (base URL; the app appends /v1/systemone). Settings in the UI win.
      PHOTOSORT_KEV_URL: ${PHOTOSORT_KEV_URL:-http://laya:8000}
    volumes:
      - ./data:/data                                  # config.yaml, proposals.json, events.jsonl
      - ${PHOTOS_INBOX_A:-/mnt/nas/photos/inbox-phone-a}:/photos/inbox/phone-a
      - ${PHOTOS_INBOX_B:-/mnt/nas/photos/inbox-phone-b}:/photos/inbox/phone-b
      - ${PHOTOS_ROOT:-/mnt/nas/photos/sorted}:/photos/sorted
    ports:
      - "8080:8080"
    depends_on:
      - laya
    # labels for Traefik, adapt to your setup:
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.photosort.rule=Host(`photosort.example.org`)
    #   - traefik.http.routers.photosort.middlewares=authelia@docker
    mem_limit: 512m

  # Decision model: Laya (open weights, Apache-2.0) behind TypeSafe's System One API, see
  # docker/laya/Dockerfile. Any other server speaking /v1/systemone (Kev, jaredpalmer/kev, SemIf
  # adapters, or Jev itself) works too: point PHOTOSORT_KEV_URL / kev_url at it and drop this
  # service. Leave kev_url empty in Settings to use the rule-based fallback without a model.
  laya:
    build: docker/laya
    image: ${LAYA_IMAGE:-ghcr.io/philippmundhenk/photosort-laya:latest}
    container_name: photosort-laya
    restart: unless-stopped
    volumes:
      - ${LAYA_MODELS:-./kev-models}:/models          # Hugging Face cache; 846 MB downloaded once
    ports:
      - "127.0.0.1:8000:8000"                         # local only: demo UI at http://localhost:8000/demo
    mem_limit: 4g                                     # ~2.2 GB resident, ~3.3 GB peak
