services:
  photosort:
    build:
      context: .
      target: runtime
    image: ${PHOTOSORT_IMAGE:-ghcr.io/philippmundhenk/photosort:latest}
    container_name: photosort
    restart: unless-stopped
    # run as the NAS user so moved files keep sane ownership on the SMB/NFS mount
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      PHOTOSORT_DATA: /data
      TZ: ${TZ:-UTC}                                  # home zone: naive photo times, video UTC conversion
    volumes:
      - ./data:/data                                  # config.yaml, proposals.json, events.jsonl
      - ${PHOTOS_INBOX:-/mnt/nas/photos/inbox}:/photos/inbox   # one subfolder per device: hans/, phone-b/, ...
      - ${PHOTOS_ROOT:-/mnt/nas/photos/sorted}:/photos/sorted
    ports:
      - "8080:8080"
    # labels for Traefik, adapt to your setup:
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.photosort.rule=Host(`photosort.example.org`)
    #   - traefik.http.routers.photosort.middlewares=authelia@docker
    mem_limit: 1g          # the record cache of a large library plus the thumbnail helper; 512m was OOM-killed

