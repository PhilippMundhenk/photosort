# Test stack. Nothing has to be installed on the host or the CI runner except Docker.
#
#   docker compose -f docker-compose.test.yml run --rm tests                        # lint + unit + e2e (browser)
#   docker compose -f docker-compose.test.yml run --rm tests pytest -m e2e -v        # only the Playwright tests
services:
  tests:
    build:
      context: .
      target: test
    image: photosort-test:local
    # default command (ruff + pytest) comes from the image

