# Test stack. Nothing has to be installed on the host or the CI runner except Docker.
#
#   docker compose -f docker-compose.test.yml run --rm tests                        # lint + unit + e2e (browser)
#   docker compose -f docker-compose.test.yml run --rm tests pytest -m e2e -v        # only the Playwright tests
#   docker compose -f docker-compose.test.yml --profile integration run --rm model-tests
#                                          # adapter against the real Model model (downloads 846 MB once)
services:
  tests:
    build:
      context: .
      target: test
    image: photosort-test:local
    # default command (ruff + pytest) comes from the image

  model-tests:
    profiles: ["integration"]
    image: photosort-test:local
    build:
      context: .
      target: test
    command: pytest -q -m integration -v
    environment:
      PHOTOSORT_MODEL_URL: http://model:8000
    depends_on:
      model:
        condition: service_healthy

  model:
    profiles: ["integration"]
    build: docker/model
    image: photosort-model:local
    volumes:
      - ${MODEL_MODELS:-./kev-models}:/models
    mem_limit: 4g
