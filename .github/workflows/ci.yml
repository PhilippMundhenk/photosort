name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Lint, unit, web and browser tests (in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: photosort-test:local
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max
      - name: Run tests (ruff + pytest, incl. browser e2e)
        run: docker run --rm photosort-test:local
      - name: Smoke script
        run: docker run --rm photosort-test:local python -m tests.smoke
      - name: Build the runtime image (this platform)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: photosort:ci
          cache-from: type=gha,scope=photosort
      - name: The runtime image starts, scans an empty inbox and serves every page
        run: |
          mkdir -p /tmp/ps/data /tmp/ps/photos/inbox/phone /tmp/ps/photos/sorted
          chmod -R a+rwx /tmp/ps
          docker run -d --name ps -p 8080:8080 -e TZ=Europe/Berlin -e PHOTOSORT_DATA=/data \
            -v /tmp/ps/data:/data -v /tmp/ps/photos:/photos --user 1000:1000 photosort:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/api/status >/dev/null && break; sleep 1; done
          curl -fs localhost:8080/api/status | grep -Eq '"dry_run": ?true'
          for p in / /review /everyday /clusters /log /settings; do curl -fso /dev/null -w "%{http_code} $p\n" localhost:8080$p | grep -q '^200'; done
          curl -fs -X POST localhost:8080/run >/dev/null || true
          sleep 20
          curl -fs localhost:8080/api/status | grep -Eq '"runs": ?[1-9]'
          test -f /tmp/ps/data/config.yaml
          docker logs ps | grep -q "executed successfully"
          docker rm -f ps

  images:
    name: Build ${{ matrix.image.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: photosort
            context: .
            target: runtime
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build (and publish on main / tags)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.image.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

