# Version bumps one at a time, each in its own PR tested by CI (issue #31: the whole set used to
# change at once on a Docker cache miss, and one of the new versions broke the browser tests).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
