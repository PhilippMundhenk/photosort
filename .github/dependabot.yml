# Version bumps one at a time, each in its own PR tested by CI (issue #31: the whole set used to
# change at once on a Docker cache miss, and one of the new versions broke the browser tests).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # pinned exactly or narrowly by their parent: they can only move with it (pydantic sets
      # pydantic-core, playwright sets pyee), so a PR for them alone never installs
      - dependency-name: pydantic-core
      - dependency-name: pyee
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # patch releases of Python 3.12 only: a new minor version needs wheels for every pinned
      # package first (3.15 had none for pydantic-core, and the slim image cannot compile it)
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
