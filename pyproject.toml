[project]
name = "photosort"
version = "0.1.0"
description = "Sort phone/camera photos into trips, day outs and occasions; a System One decision model judges what rules cannot"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: browser tests against a real uvicorn server (Playwright); deselect with -m 'not e2e'",
]
filterwarnings = [
    "ignore:.*on_event is deprecated.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM108", "UP007", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011", "SIM"]
"tests/e2e/test_smooth.py" = ["F811"]   # fixtures imported from test_browser
"tests/e2e/test_features.py" = ["F811"]
