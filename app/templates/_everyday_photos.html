{# one day's photos on the Everyday page; the page and /everyday/day render them the same way #}
{% macro day_figures(photos) %}{% for ph in photos %}
    <figure class="{{ 'uncertain' if ph.zone == 'unknown' }}" data-path="{{ ph.path }}">
      <span class="pick" role="checkbox" aria-checked="false" tabindex="0" title="{{ ph.file }} · click to select"><img src="/thumb?path={{ ph.path|urlencode }}" loading="lazy" alt=""></span>
      <span class="view" role="button" tabindex="0" data-view="/media?path={{ ph.path|urlencode }}" data-type="{{ ph.media }}" data-title="{{ ph.file }} · {{ ph.ts[:16].replace('T',' ') }} · {{ ph.place or ph.zone }}" title="view full size">&#x2921;</span>
      <figcaption>{% if ph.media == 'video' %}<span class="badge">video</span> {% endif %}{{ ph.ts[11:16] }} {{ ph.zone }}{% if ph.place %} · {{ ph.place }}{% endif %}</figcaption>
    </figure>{% endfor %}{% endmacro %}
