<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="photosort">
  <title>photosort</title>
  <rect width="128" height="128" rx="28" fill="#171a21"/>
  <!-- three photos fanned out: a stack being sorted -->
  <g transform="rotate(-14 64 70)">
    <rect x="26" y="40" width="58" height="46" rx="6" fill="#262b36" stroke="#8b93a3" stroke-width="2.5"/>
  </g>
  <g transform="rotate(-4 64 70)">
    <rect x="32" y="38" width="58" height="46" rx="6" fill="#262b36" stroke="#b8bfcc" stroke-width="2.5"/>
  </g>
  <g transform="rotate(8 64 70)">
    <rect x="38" y="36" width="58" height="46" rx="6" fill="#e6e8ec"/>
    <!-- a landscape on the top photo -->
    <path d="M42 76 L58 58 L68 68 L76 60 L92 76 Z" fill="#3ecf8e"/>
    <circle cx="82" cy="47" r="5" fill="#f5b84c"/>
  </g>
  <!-- the place pin: sorted by where and when -->
  <path d="M92 30c-10.5 0-19 8.3-19 18.6 0 13.4 19 33.4 19 33.4s19-20 19-33.4C111 38.3 102.5 30 92 30z"
        fill="#5aa9ff" stroke="#171a21" stroke-width="4"/>
  <circle cx="92" cy="48.5" r="7" fill="#171a21"/>
</svg>
